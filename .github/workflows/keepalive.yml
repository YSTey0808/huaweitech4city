name: keep-backend-warm

# Free Hugging Face Spaces pause after ~48 h without requests. This pings the
# backend's /health route every 2 h so the Space never sleeps (and thus never
# pays the cold-start model-load cost). Set the repo variable BACKEND_HEALTH_URL
# to https://<hf-user>-<space-name>.hf.space/health.
#
# Note: scheduled workflows only run from the DEFAULT branch (main), and GitHub
# pauses schedules after ~60 days of no repo activity.

on:
  schedule:
    - cron: "0 */2 * * *" # every 2 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: curl -fsS "${{ vars.BACKEND_HEALTH_URL }}" || exit 0
